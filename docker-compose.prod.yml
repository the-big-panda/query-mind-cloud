version: '3.8'

services:
  # PostgreSQL Database - production setup
  postgres:
    image: postgres:16-alpine
    container_name: nl2sql-postgres-prod
    environment:
      POSTGRES_DB: nl2sql_backend
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nl2sql-network-prod
    restart: always

  # Redis for session management
  redis:
    image: redis:7-alpine
    container_name: nl2sql-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nl2sql-network-prod
    restart: always

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  nl2sql-network-prod:
    driver: bridge
