version: '3.8'

services:
  # PostgreSQL runs NATIVELY on EC2 (not in container)
  # Redis runs NATIVELY on EC2 (not in container)
  # BE-Project stores data locally on user's machine
  
  ollama:
    image: ollama/ollama:latest
    container_name: cloud-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_DEBUG: 0
    restart: unless-stopped
    networks:
      - cloud-network

volumes:
  ollama_data:

networks:
  cloud-network:
    driver: bridge
